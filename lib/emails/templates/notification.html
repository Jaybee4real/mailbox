<!doctype html>
<html>
  <body style="margin:0;background:#050309;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="max-width:600px;margin:0 auto;padding:32px 24px">

      <div style="font:700 22px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F5F2FA;margin:0 0 6px">
        {{title}}
      </div>
      <div style="font:500 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#A578FF;letter-spacing:.18em;text-transform:uppercase;margin:0 0 28px">
        Podzyme · Inbox
      </div>

      <table style="width:100%;border-collapse:collapse;border:1px solid #2C1F4A;border-radius:10px;overflow:hidden">
        {{rows}}
      </table>

      <p style="font:400 12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#5A5170;margin:24px 0 0">
        Sent from {{host}} · {{date}}
      </p>

    </div>
  </body>
</html>
