<!doctype html>
<html>
  <body style="margin:0;background:#050309;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="max-width:600px;margin:0 auto;padding:40px 24px">

      <div style="font:500 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:{{accent}};letter-spacing:.18em;text-transform:uppercase;margin:0 0 20px">
        {{eyebrow}}
      </div>

      <div style="border:1px solid #2C1F4A;border-radius:14px;background:#0A0613;padding:32px 30px">

        <div style="font:700 22px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F5F2FA;margin:0 0 12px">
          {{title}}
        </div>

        <div style="font:400 15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#B4AEC6;margin:0 0 26px">
          {{body}}
        </div>

        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse">
          <tr>
            <td style="border-radius:10px;background:{{accent}}">
              <a href="{{actionUrl}}" style="display:inline-block;padding:13px 26px;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#FFFFFF;text-decoration:none">
                {{actionLabel}}
              </a>
            </td>
          </tr>
        </table>

        <div style="font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#7A7290;margin:26px 0 0;padding:16px 0 0;border-top:1px solid #1E1533">
          {{expiry}}
        </div>

        <div style="font:400 12px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#5A5170;margin:14px 0 0;word-break:break-all">
          If the button does not open, paste this into your browser:<br />
          <span style="color:#7A7290">{{actionUrl}}</span>
        </div>

      </div>

      <div style="font:400 12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#5A5170;margin:22px 0 0">
        {{footer}}
      </div>

    </div>
  </body>
</html>
