<!doctype html>
<html>
  <body style="margin:0;background:#050309;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="max-width:600px;margin:0 auto;padding:36px 24px">
      <div style="display:inline-block;width:42px;height:48px;background:linear-gradient(135deg,#6B25E0,#EE3F88);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-bottom:18px"></div>
      <div style="font:700 24px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F5F2FA;margin:0 0 8px">
        {{headline}}
      </div>
      <div style="font:500 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#A578FF;letter-spacing:.18em;text-transform:uppercase;margin:0 0 22px">
        Podzyme · {{kicker}}
      </div>

      <p style="font:400 15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#C8BFD9;margin:0 0 24px">
        {{lead}}
      </p>

      <div style="font:600 11px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#A578FF;letter-spacing:.18em;text-transform:uppercase;margin:0 0 10px">
        Your submission
      </div>
      <table style="width:100%;border-collapse:collapse;border:1px solid #2C1F4A;border-radius:10px;overflow:hidden">
        {{rows}}
      </table>

      <p style="font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#8E84A8;margin:24px 0 0">
        Need to update something? Just reply to this email — we'll see it.
      </p>
      <p style="font:400 12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#5A5170;margin:18px 0 0">
        — The Podzyme team · <a href="{{brandUrl}}" style="color:#A578FF;text-decoration:none">{{brandHost}}</a>
      </p>

    </div>
  </body>
</html>
