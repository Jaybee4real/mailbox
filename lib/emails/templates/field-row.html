<tr>
  <td style="padding:10px 14px;background:{{labelBg}};color:#8E84A8;font:600 12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #2C1F4A;vertical-align:top;width:{{labelWidth}}px">{{label}}</td>
  <td style="padding:10px 14px;background:{{valueBg}};color:#F5F2FA;font:400 14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;border-bottom:1px solid #2C1F4A;white-space:pre-wrap">{{value}}</td>
</tr>
